# Mode flags and run settings. Read by src/sonar/config.py.
#   auth:          subscription (your Claude login, for development) or openrouter (API key, for scheduled runs).
#                  The key goes in the gitignored .env as OPENROUTER_API_KEY, never here (read only by secrets.py)
#   navigation_model / navigation_effort: model and reasoning effort of the browsing agent (auth: openrouter only)
#   summary_model: model that writes the summaries (auth: openrouter only)
#   navigator:     dom (built) or vision (not built yet)
#   matcher:       keywords or jev. Jev needs OPENROUTER_API_KEY in .env (whatever `auth` is) and the text in company_file.
#                  Switching to jev scores EVERY stored listing that has no Jev decision yet (a backfill), and retries any Jev could not score.
#   database_url:  where listings and decisions are stored
#   keywords_file: client keyword list used by the keywords matcher
#   company_file:  what the client does: the text of Jev's one yes/no question (jev matcher only)
#   jev_model:     pinned Jev version. Thresholds only mean something for one version; re-check the labeled set before changing it
#   jev_match_threshold / jev_review_threshold: Jev's probability of "yes". At or above the first: a match. From the second up to the first:
#                  a match flagged "needs review, not confident". Below the second: not a match
#   jev_max_chars: the posting text sent to Jev is cut to this many characters
#   timezone:      the business time zone (IANA name). Report times and "today" for the first-run window use it
#   headless:      false shows the browser window. Headless mode sends a normal (non-"Headless") user agent, because CanadaBuys returns 403 to "HeadlessChrome".
#   cdp_port:      remote-debugging port of the dedicated browser
#   report_dir:    where each run's report files (.html and .txt) are written
#   screenshot_dir: where a screenshot is saved when navigation fails (inside data/, never committed)
#   route_notes_dir: where the agent's note on how it reached each site's list is kept (one line per change; inside data/, never committed)
#   summaries:     true: an agent writes a short summary for each match (needs the Claude login)
#   summary_workers: how many summary agents run at the same time (each is a separate process)
#   max_agent_calls / max_new_per_site / max_summaries: cost caps per run (all agent calls; new postings per site; summaries).
#                  Hitting one ends the run as "partial", the email says which, and a cut-short site keeps its watermark. Blank = no limit
#   max_run_usd:   dollar cap per run, read from the OpenRouter key's spend (auth: openrouter only). OpenRouter updates spend with a
#                  delay of several seconds, so the run can overshoot by about one call. Blank = no limit
#   max_call_usd:  the SDK's own dollar cap per agent call. Its figure is exact for Sonnet but about 2x too high for GPT-6.1 Sol, so it errs toward stopping early
#   email:         ON BY DEFAULT. Do not set it to false without the developer's explicit say-so. true: send the report (HTML table plus a plain-text copy) by SMTP after each run. The password is NOT here:
#                  put SONAR_SMTP_PASSWORD=... in the gitignored .env file (read only by secrets.py)
#   smtp_host / smtp_port: the mail server (587 = STARTTLS, 465 = TLS)
#   smtp_username: login name; blank means use email_from
#   email_from / email_to: sender and the one recipient
auth: subscription
navigation_model: anthropic/claude-sonnet-5.5
navigation_effort: medium
summary_model: anthropic/claude-sonnet-5.5
navigator: dom
matcher: keywords
database_url: "sqlite:///data/sonar.db"
keywords_file: config/keywords.yaml
company_file: config/company.yaml
jev_model: typesafe/jev-1.13
jev_match_threshold: 0.6
jev_review_threshold: 0.3
jev_max_chars: 12000
timezone: America/Toronto
headless: false
cdp_port: 9333
report_dir: data/reports
screenshot_dir: data/screenshots
route_notes_dir: data/route-notes
summaries: true
summary_workers: 3
max_agent_calls:
max_new_per_site:
max_summaries:
max_run_usd: 5
max_call_usd:
email: true
smtp_host: smtp.gmail.com
smtp_port: 587
email_from: shangariaaveg@gmail.com
email_to: shangariaaveg@gmail.com
