# Fake listings for testing the keyword matcher. NOT real data.
# Each entry says which keywords (from config/keywords.yaml) the matcher must find.
# `expected` is the exact set of keywords, spelled as in keywords.yaml. [] means no match.
listings:
  - id: single-word
    why: A plain single-word keyword is found.
    title: SAP support for finance team
    text: The department requires SAP consultants to support month-end reporting.
    expected: [SAP]

  - id: phrase
    why: A multi-word keyword is found as a phrase.
    title: HR system rollout support
    text: Provide software consulting and change management services for the new HR system rollout.
    expected: [change management]

  - id: case-insensitive
    why: Capitalization does not matter.
    title: Database and platform admins
    text: ORACLE database administrators wanted, plus a servicenow platform owner.
    expected: [Oracle, ServiceNow]

  - id: near-miss-words
    why: Keywords inside longer words must NOT match (saplings, Workdays).
    title: Park landscaping supplies
    text: Supply of saplings and mulch for city parks. Workdays are Monday to Friday.
    expected: []

  - id: scattered-phrase-words
    why: The words of a phrase appearing apart, or out of order, must NOT match.
    title: Office reorganization review
    text: The management of this project requires a change in management structure.
    expected: []

  - id: many-keywords
    why: Several keywords in one listing are all reported, including overlapping ones.
    title: Enterprise modernization program
    text: >-
      Deliver Microsoft Dynamics 365 and SAP integration as part of a Business
      Transformation program, with Project Management, RPA bots and business
      intelligence dashboards.
    expected:
      - Dynamics 365
      - Microsoft Dynamics
      - SAP
      - Business Transformation
      - Project Management
      - RPA
      - Business intelligence

  - id: no-keywords
    why: A listing with nothing relevant gives no match.
    title: Janitorial services
    text: Daily cleaning of office space, including washrooms and common areas.
    expected: []

  - id: brackets
    why: A keyword next to brackets is found (each name matches separately).
    title: Automation pilot
    text: Build Robotic Process Automation (RPA) bots for invoice processing.
    expected: [Robotic Process Automation, RPA]

  - id: exact-phrase-capitalized
    why: A phrase in title case still matches.
    title: Standing offer
    text: Supply of IT Professional Services under a standing offer.
    expected: [IT Professional Services]

  - id: ms-dynamics-abbreviation
    why: The abbreviation MS Dynamics matches on its own, without Microsoft.
    title: CRM developer
    text: Experience with MS Dynamics CRM is required.
    expected: [MS Dynamics]

  - id: punctuation-boundaries
    why: Keywords next to commas, semicolons and hyphens still match as whole words.
    title: Legacy migration
    text: Migrate from PeopleSoft to Workday; Oracle-based reports must be rebuilt.
    expected: [Peoplesoft, Workday, Oracle]

  - id: messy-whitespace
    why: Web text has line breaks and double spaces; phrases must still match.
    title: Messy copy
    text: "Lead change\nmanagement and Business  intelligence reporting for a cloud platform."
    expected: [change management, Business intelligence]

  - id: repeated-keyword
    why: A keyword appearing three times is still one matched keyword.
    title: SAP everywhere
    text: SAP is used here. We run SAP for finance and sap for HR.
    expected: [SAP]

  - id: teams-meeting-link
    why: A Microsoft Teams link for a site visit is not Microsoft IT work ("Microsoft" alone is not a keyword).
    title: Storage shed construction
    text: >-
      The site visit is virtual. Location: Microsoft Teams, https://teams.microsoft.com/meet/12345.
      Contractors must supply and install a new storage shed.
    expected: []

  - id: office-software-mention
    why: Word and Excel are not the Microsoft 365 / Dynamics stack the client means.
    title: Administrative training
    text: Staff need training in Microsoft Word and Microsoft Excel for report writing.
    expected: []

  - id: microsoft-stack-products
    why: The Microsoft stack is found by its products.
    title: Reporting platform
    text: Build Power BI dashboards on Azure with data from SharePoint, using Dataverse and Power Apps.
    expected: [Power BI, Azure, SharePoint, Dataverse, Power Apps]

  - id: ariba-portal-only
    why: SAP Ariba and SAP Business Network are portals tenders name for bidding, not SAP work.
    title: Office furniture supply
    text: >-
      Documents can be downloaded when logged into your SAP Ariba account. Questions go through the
      Event Messages tab in the SAP Business Network event. SAP Fieldglass is not used.
    expected: []

  - id: sap-project-with-ariba-instructions
    why: A real SAP project still matches when the tender also names the Ariba portal.
    title: SAP S/4HANA migration
    text: Implement SAP S/4HANA for finance. Submit your bid through SAP Ariba before closing.
    expected: [SAP]

  - id: generic-keyword-in-non-client-work
    why: A generic keyword (Project Management) in work outside recruitment, consulting and tech does not count.
    title: Survey of student habits
    text: The contractor will provide project management and field staff to run a student survey in schools.
    expected: []

  - id: generic-keyword-with-consulting-context
    why: The same generic keyword counts when the posting is consulting work.
    title: PMO support
    text: The department seeks consulting services to support its Project Management Office.
    expected: [Project Management]

  - id: generic-keyword-with-specific-keyword
    why: A generic keyword counts when a specific keyword (SAP) shows the work is IT, even with no context term.
    title: ERP program
    text: A Business Transformation program to move payroll onto SAP.
    expected: [Business Transformation, SAP]
