# Source registry. One entry per bidding site. No selectors and no per-site code: the navigation
# agent works out each site's layout itself. Hints are plain English and optional.
#   name:           short key, stored with every listing
#   start_url:      where the agent starts: the list itself, or a home/login page it can click through from
#   allowed_hosts:  the browser may only navigate to these hosts (guard). Each entry is a host name, or
#                   {host: ..., hint: "..."} to give the agent a tip about that host (for example where the list is)
#   hint:           optional plain-English tip about the whole site
#   requires_login: login is done by our code, never the agent
#   max_list_pages: safety cap on list steps ("load more" / next page) per run (default 10)
#   first_run_days: with an empty database, how many days back to collect (default 3)
sites:
  - name: canadabuys
    start_url: "https://canadabuys.canada.ca/en/tender-opportunities?status%5B0%5D=87&current_tab=t&record_per_page=50&order=pub_ifnot_amended&sort=desc"
    allowed_hosts: ["canadabuys.canada.ca"]
    hint: "Search results of open tender opportunities; each result links to its own tender notice page."
    requires_login: false
  - name: ontariotenders
    start_url: "https://ontariotenders.app.jaggaer.com/esop/nac-host/public/web/login.html"
    allowed_hosts:
      - host: ontariotenders.app.jaggaer.com
        hint: "The start page is a login page; the job list is behind its 'Opportunities Open to All Suppliers' link."
    requires_login: false
