[project]
name = "sonar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AviShangari", email = "shangariaaveg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.165",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
sonar = "sonar:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
